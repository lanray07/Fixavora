name: Android checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: python3 tools/localize.py validate
      - run: python3 -m unittest discover -s server -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/cloudflare/worker.test.mjs
      - run: ./gradlew testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest --console=plain
      - run: ./gradlew lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-evidence
          path: |
            app/build/outputs/apk/
            app/build/test-results/
            app/build/reports/
